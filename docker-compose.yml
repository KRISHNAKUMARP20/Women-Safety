version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: girls_safety_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/girlssafety
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: girls_safety_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: girlssafety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  redis:
    image: redis:7-alpine
    container_name: girls_safety_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
    driver: local
