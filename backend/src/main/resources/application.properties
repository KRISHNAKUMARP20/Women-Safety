# Girls Safety System - Spring Boot Application Properties
server.port=8080
spring.application.name=girls-safety-system

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/girlssafety
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security
jwt.secret=9a4f2c8d3b7a1e6f5c8d0b2a4e6f8a1c3d5e7b9a2c4d6f8e0a2b4c6d8e0f2a4
jwt.expiration.ms=86400000

# Emergency Geolocation Thresholds
emergency.nearest.station.max.radius.km=25.0
emergency.sms.gateway.enabled=true
